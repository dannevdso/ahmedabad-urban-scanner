[project]
name = "ahmedabad-urban-scanner"
version = "0.1.0"
description = "Reproducible building, accessibility, heat, and greenery analysis for Ahmedabad"
requires-python = ">=3.12,<3.15"
dependencies = [
    "city2graph>=1.0.0",
    "matplotlib>=3.10",
    "contextily>=1.6",
    "osmnx>=2.0.3",
    "jupyter>=1.0",
    "s2sphere>=0.2.5",
    "pystac-client>=0.9.0",
    "planetary-computer>=1.0.0",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.13",
    "torchvision>=0.28",
    "torch-geometric>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ahmedabad_scanner"]

[tool.uv]
default-groups = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
